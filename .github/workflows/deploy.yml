name: Deploy Mosaify to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'project.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'nx.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Spotify OAuth vars (public PKCE client ID + redirect URI) come from the
      # committed apps/mosaify/.env.production, which Vite loads in build mode.
      - name: 🛠️ Build mosaify app
        run: npx nx build mosaify --configuration=production

      - name: 📁 Copy built app to public-deploy/mosaify
        run: |
          mkdir -p public-deploy/mosaify
          cp -r apps/mosaify/dist/* public-deploy/mosaify/
          # SPA fallback so deep links resolve on GitHub Pages
          cp public-deploy/mosaify/index.html public-deploy/mosaify/404.html

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-deploy
          keep_files: false
